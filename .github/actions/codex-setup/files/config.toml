# Rosetta CI Codex configuration, copied verbatim to $CODEX_HOME/config.toml by
# .github/actions/codex-setup. TRUSTED workflow configuration: it ships in this repo and
# is never sourced from a checkout under test. Codex does not sanitize this file or the
# permission profiles it defines.
#
# Network is granted WHOLESALE, not per-domain: Codex can express an egress allow-list
# (`[experimental_network]` with a `domains` table) but that key is `experimental_*`, and
# experimental features are not enabled in this pipeline. Same egress posture as the
# Claude branch, which restricts the `gh` command surface rather than the network.

# On-disk effect of `codex features enable hooks`; the Rosetta core-codex plugin
# ships .codex/hooks.json and is inert without it.
[features]
hooks = true

# Read-only filesystem + network. For pipelines whose only side effects go
# through `gh` (analysis, planning, triage).
[permissions.rosetta-read-net]
description = "Rosetta CI: read-only filesystem, network allowed for the gh CLI."
extends = ":read-only"

# `:read-only` still permits reading ANY path. These denies mirror the Claude
# branch's `--disallowedTools "Read(//proc/**),Read(//etc/**)"`, which exists so a
# prompt-injected instruction cannot read the runner's process environment. A
# deny covers the whole subtree.
[permissions.rosetta-read-net.filesystem]
"/proc" = "deny"
"/etc" = "deny"

[permissions.rosetta-read-net.network]
enabled = true

# Workspace-write, no network. For pipelines that only produce local files
# (prompt validation), where the workflow itself does the posting.
[permissions.rosetta-workspace]
description = "Rosetta CI: workspace-write, no network."
extends = ":workspace"

[permissions.rosetta-workspace.filesystem]
"/proc" = "deny"
"/etc" = "deny"

[permissions.rosetta-workspace.network]
enabled = false

# Workspace-write + network. For the implementer, which edits the tree, runs
# builds, commits and pushes a branch.
[permissions.rosetta-workspace-net]
description = "Rosetta CI: workspace-write, network allowed for gh and git push."
extends = ":workspace"

[permissions.rosetta-workspace-net.filesystem]
"/proc" = "deny"
"/etc" = "deny"

# `.git` is spelled out rather than relied on: the implementer must be able to
# commit, and `:workspace` documents keeping the workspace `.codex` read-only
# without stating where `.git` lands. An explicit re-grant is cheap insurance.
[permissions.rosetta-workspace-net.filesystem.":workspace_roots"]
"." = "write"
".git" = "write"

[permissions.rosetta-workspace-net.network]
enabled = true
